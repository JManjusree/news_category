
name: News Category ML Pipeline CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pipelines/**"
      - "requirements.txt"
      - "data/raw/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "pipelines/**"
      - "requirements.txt"
      - "data/raw/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-category-ml-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ml-pipeline:
    name: Run News Category ML Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Kaggle credentials are missing."
            exit 1
          fi

          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' \
            "$KAGGLE_USERNAME" "$KAGGLE_KEY" \
            > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download Kaggle dataset
        run: |
          mkdir -p data/raw
          kaggle datasets download \
            -d rmisra/news-category-dataset \
            -p data/raw \
            --unzip

          test -f data/raw/News_Category_Dataset_v3.json

      - name: Run Lab 7 ML pipeline
        run: |
          python src/mlops_pipeline/run_lab7_news_pipeline.py

      
      - name: Verify pipeline reports
        run: |
          test -f reports/lab7_pipeline_report.json
          test -f reports/lab7_evaluation_report.json
          test -f artifacts/lab7/inference_predictions.csv
          test -f models/lab7_news_pipeline.joblib

          python -c "import json; p=json.load(open('reports/lab7_pipeline_report.json')); assert p['overall_status']=='PASSED'; print('ML pipeline report validation passed')"

      - name: Generate CI execution summary
        if: always()
        run: |
          mkdir -p reports

          {
            echo "## News Category ML Pipeline CI"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run attempt: $GITHUB_RUN_ATTEMPT"
            echo ""
            echo "See the job steps above for execution results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-category-ci-artifacts
          path: |
            reports/
            artifacts/lab7/
            logs/
          if-no-files-found: warn
          retention-days: 14
